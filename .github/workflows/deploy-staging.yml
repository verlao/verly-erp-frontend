name: Deploy Staging

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: verlao/verly-erp-frontend

# Runner self-hosted é a MESMA Pi de produção → serializa os runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy Staging
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Opção A: build do front num container node efêmero (runner/Pi só precisa
      # de Docker; nada de Node instalado no host). Limites pra não sufocar prod.
      - name: Build staging application (node container)
        run: |
          docker run --rm -v "$PWD":/app -w /app \
            --cpus 2 --memory 3g \
            -e NODE_ENV=production \
            -e VITE_API_URL=https://staging-api.verlyvidracaria.com/verly-service \
            -e VITE_POST_LOGIN_REDIRECT=/products \
            node:20 sh -c "npm ci && npm run build"
          cp dist/index.html dist/404.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          platforms: linux/arm64

  deploy:
    name: Deploy to Swarm
    runs-on: self-hosted
    needs: build-and-deploy
    environment:
      name: staging
      url: https://staging-painel.verlyvidracaria.com

    steps:
      - name: Deploy staging stack
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging

          echo "Updating staging stack..."
          docker stack deploy \
            --compose-file /home/matt/orange-juice-box/stacks/verly-staging/docker-compose.yml \
            --resolve-image always \
            --with-registry-auth \
            verly-staging

          sleep 5

      - name: Verify deployment
        run: |
          SERVICE_NAME="verly-staging_verly-frontend"
          for i in $(seq 1 20); do
            HEALTH=$(docker service ps "$SERVICE_NAME" --filter "desired-state=running" --format "{{.CurrentState}}" | head -1)
            echo "[$i/20] $SERVICE_NAME: $HEALTH"
            if echo "$HEALTH" | grep -q "Running"; then
              echo "Staging frontend deployed!"
              exit 0
            fi
            sleep 5
          done
          echo "Staging frontend deploy timeout"
          docker service logs --tail 30 "$SERVICE_NAME"
          exit 1

      - name: Smoke test public URL
        run: |
          URL="https://staging-painel.verlyvidracaria.com/"
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 10 "$URL" || true)
            echo "[$i/12] GET $URL -> $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Staging URL healthy ($URL)"
              exit 0
            fi
            sleep 5
          done
          echo "Staging URL não respondeu 200"
          exit 1
