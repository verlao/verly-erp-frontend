name: CI/CD Pipeline - Frontend

on:
  push:
    branches: [ dev, prod ]
    paths:
      - 'src/**'
      - 'package*.json'
      - 'Dockerfile*'
      - 'nginx.docker.conf'
      - '.github/workflows/ci-cd.yml'
      - '.env.*'
  pull_request:
    branches: [ prod ]
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set environment for staging
        if: github.ref == 'refs/heads/dev'
        run: cp .env.staging .env

      - name: Set environment for production
        if: github.ref == 'refs/heads/prod'
        run: cp .env.production .env

      - name: Build application
        run: npm run build

      - name: Copy index.html to 404.html (SPA routing)
        run: cp dist/index.html dist/404.html

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/prod' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64

  deploy-staging:
    name: Deploy Staging to Docker Swarm
    runs-on: self-hosted
    needs: docker
    if: github.ref == 'refs/heads/dev'
    environment: staging

    steps:
      - name: Deploy staging to Docker Swarm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}:staging

          echo "Deploying frontend staging stack..."
          docker service update \
            --image ${{ env.REGISTRY }}/${{ github.repository }}:staging \
            --force \
            verly-staging_verly-frontend 2>/dev/null || \
          echo "Service not found - ensure the frontend staging service exists in the Swarm"

          sleep 5
          docker image prune -f --filter "until=24h"

      - name: Verify staging deployment
        run: |
          SERVICE_NAME="verly-staging_verly-frontend"
          MAX_ATTEMPTS=20
          SLEEP_TIME=5

          for i in $(seq 1 $MAX_ATTEMPTS); do
            RUNNING=$(docker service ps "$SERVICE_NAME" --filter "desired-state=running" --format "{{.CurrentState}}" | grep -c "Running" || echo "0")
            echo "[$i/$MAX_ATTEMPTS] Tasks running: $RUNNING"
            if [ "$RUNNING" -ge "1" ]; then
              echo "Staging frontend deploy verified!"
              exit 0
            fi
            sleep $SLEEP_TIME
          done
          echo "Staging frontend deploy verification timeout"
          exit 1

  deploy-production:
    name: Deploy Production to Docker Swarm
    runs-on: self-hosted
    needs: docker
    if: github.ref == 'refs/heads/prod'
    environment: production

    steps:
      - name: Deploy production to Docker Swarm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.REGISTRY }}/${{ github.repository }}:latest

          echo "Deploying frontend production stack..."
          docker service update \
            --image ${{ env.REGISTRY }}/${{ github.repository }}:latest \
            --force \
            verly_verly-frontend 2>/dev/null || \
          echo "Service not found - ensure the frontend production service exists in the Swarm"

          sleep 5
          docker image prune -f --filter "until=24h"

      - name: Verify production deployment
        run: |
          SERVICE_NAME="verly_verly-frontend"
          MAX_ATTEMPTS=20
          SLEEP_TIME=5

          for i in $(seq 1 $MAX_ATTEMPTS); do
            RUNNING=$(docker service ps "$SERVICE_NAME" --filter "desired-state=running" --format "{{.CurrentState}}" | grep -c "Running" || echo "0")
            echo "[$i/$MAX_ATTEMPTS] Tasks running: $RUNNING"
            if [ "$RUNNING" -ge "1" ]; then
              echo "Production frontend deploy verified!"
              exit 0
            fi
            sleep $SLEEP_TIME
          done
          echo "Production frontend deploy verification timeout"
          exit 1

  deploy-github-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/prod'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
