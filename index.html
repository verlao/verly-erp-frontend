<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Performance: Preconnect to API -->
    <link rel="preconnect" href="https://api.verlyvidracaria.com" />
    <link rel="dns-prefetch" href="https://api.verlyvidracaria.com" />

    <!-- SEO and PWA -->
    <meta name="description" content="Sistema de Gestão ERP - Verly Vidraçaria" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <!-- GitHub Pages SPA redirect fix -->
    <script>
      // Restaura a URL correta após redirecionamento do 404.html
      (function() {
        const redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect != location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>

    <!-- Prevent FOUC (Flash of Unstyled Content) -->
    <script>
      (function() {
        const themeMode = localStorage.getItem('theme-mode') || 'system';
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        let isDark = false;
        if (themeMode === 'dark') {
          isDark = true;
        } else if (themeMode === 'system') {
          isDark = prefersDark;
        }

        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <title>Verly ERP - Sistema de Gestão</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
